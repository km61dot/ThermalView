name: ThermalState

options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"

targets:
  ThermalState:
    type: application
    platform: iOS

    sources:
      - path: .

    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.local.ThermalState

      INFOPLIST_KEY_CFBundleDisplayName: Thermal State

      INFOPLIST_KEY_UILaunchScreen_Generation: YES

      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""

name: ThermalState

options:
  xcodeVersion: "15.4"

  bundleIdPrefix: com.local

  deploymentTarget:
    iOS: "17.0"

targets:
  ThermalState:
    type: application
    platform: iOS

    sources:
      - path: .

    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.local.ThermalState

      INFOPLIST_KEY_CFBundleDisplayName: Thermal State

      INFOPLIST_KEY_UILaunchScreen_Generation: YES

      GENERATE_INFOPLIST_FILE: YES

      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""

      IPHONEOS_DEPLOYMENT_TARGET: "17.0"

      TARGETED_DEVICE_FAMILY: "1"

name: ThermalView

options:
  bundleIdPrefix: com.km61dot
  deploymentTarget:
    iOS: "17.0"

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  ThermalView:
    type: application
    platform: iOS
    sources:
      - path: ThermalStateApp.swift
      - path: Services
      - path: Models
      - path: ViewModels
      - path: Views
      - path: Utilities
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.km61dot.thermalview
      PRODUCT_NAME: ThermalView
      INFOPLIST_KEY_CFBundleDisplayName: ThermalView
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      TARGETED_DEVICE_FAMILY: "1"

  ThermalViewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ThermalView
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.km61dot.thermalview.tests
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGNING_ALLOWED: NO
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"

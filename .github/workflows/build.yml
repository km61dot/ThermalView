name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          xcodebuild \
            -project ThermalView.xcodeproj \
            -scheme ThermalView \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project ThermalView.xcodeproj \
            -scheme ThermalView \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*Release-iphoneos/ThermalView.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ThermalView.app not found"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          if [ -d "Payload/ThermalView.app/_CodeSignature" ]; then
            echo "Unexpected code signature found"
            exit 1
          fi
          if find Payload/ThermalView.app -name "embedded.mobileprovision" | grep -q .; then
            echo "Unexpected embedded mobileprovision found"
            exit 1
          fi
          /usr/bin/zip -qry ThermalView-unsigned.ipa Payload
          shasum -a 256 ThermalView-unsigned.ipa > ThermalView-unsigned.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ThermalView-unsigned-ipa
          path: |
            ThermalView-unsigned.ipa
            ThermalView-unsigned.ipa.sha256
